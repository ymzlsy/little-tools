<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; }
  #stage { position: absolute; inset: 0; }

  .sec-plane {
    position: absolute; top: 0; left: 0;
    font-size: 220px; line-height: 1; z-index: 3;
    will-change: offset-distance, offset-rotate;
  }
  .sec-logo {
    position: absolute; top: 0; left: 0; z-index: 2;
    width: 132px; height: 132px; border-radius: 30px; object-fit: contain;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    transform: translate(-50%, -50%);
    will-change: top, left;
  }
  /* 被拖的横幅（三种场景都带；含 LOGO + 任务内容，按类型配色） */
  .sec-banner {
    position: absolute; top: 0; left: 0; z-index: 2;
    transform: translate(-100%, -50%); /* 右边缘对准绳子末端 → 绳子系在横幅最右侧 */
    display: flex; align-items: center; gap: 14px;
    white-space: nowrap; /* 横幅文字始终单行，不换行 */
    padding: 14px 24px; border-radius: 18px;
    font: 800 28px/1.25 -apple-system, "PingFang SC", sans-serif; color: #fff;
    background: linear-gradient(135deg, #555, #333);
    border: 2px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4);
    will-change: top, left;
  }
  .sec-banner-logo { width: 52px; height: 52px; border-radius: 14px; object-fit: contain; flex: 0 0 auto; }
  .sec-banner.t-auth    { background: linear-gradient(135deg, #ff5a5a, #c0392b); }
  .sec-banner.t-confirm { background: linear-gradient(135deg, #ff9f43, #e67e22); }
  .sec-banner.t-stuck   { background: linear-gradient(135deg, #ffd23f, #f1b000); color: #3a2e00; }
  .sec-banner.t-done    { background: linear-gradient(135deg, #2ecc71, #1e9e57); }
  .sec-banner.t-nag     { background: linear-gradient(135deg, #ff8a3d, #e8442b); }
  .sec-banner.col       { flex-direction: column; align-items: flex-start; gap: 4px; }
  .sec-banner-sub       { font-size: 18px; font-weight: 600; opacity: 0.92; }
  /* 软绳：SVG 曲线，自然下垂 */
  .sec-rope-svg {
    position: absolute; inset: 0; z-index: 2; overflow: visible;
  }
  .sec-rope-path {
    fill: none; stroke: rgba(255, 255, 255, 0.85); stroke-width: 5; stroke-linecap: round;
  }
  /* 橙色半透明飞机云拖尾 */
  .puff {
    position: absolute; z-index: 1;
    background: radial-gradient(circle, rgba(255, 150, 50, 0.55), rgba(255, 150, 50, 0));
    border-radius: 50%;
    transform: translate(-50%, -50%);
    will-change: opacity, transform;
    animation: puff 2.6s ease-out forwards;
  }
  @keyframes puff {
    from { opacity: 0.7; transform: translate(-50%, -50%) scale(0.5); }
    to   { opacity: 0;   transform: translate(-50%, -50%) scale(2.8); }
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="secondary.js"></script>
</body>
</html>
