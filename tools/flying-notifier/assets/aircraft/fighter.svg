<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 0 266 150" width="266" height="150">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset=".5" stop-color="#cdd6e1"/>
      <stop offset="1" stop-color="#8d99ab"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7edf4"/>
      <stop offset="1" stop-color="#9aa6b8"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset=".5" stop-color="#ff9012"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>
    <radialGradient id="glass" cx=".36" cy=".28" r=".9">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="1" stop-color="#2f8bff"/>
    </radialGradient>
    <linearGradient id="msl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#aab4c2"/>
    </linearGradient>
  </defs>

  <!-- 尾焰（双发，机尾在左） -->
  <polygon points="12,66 -24,69 12,72" fill="url(#flame)"/>
  <polygon points="12,78 -24,81 12,84" fill="url(#flame)"/>

  <!-- 主翼（宽大后掠） -->
  <g fill="url(#wing)" stroke="#2b3038" stroke-width="3" stroke-linejoin="round">
    <polygon points="150,62 76,6 52,16 96,62"/>
    <polygon points="150,82 76,138 52,128 96,82"/>
  </g>

  <!-- 鸭翼 -->
  <g fill="url(#wing)" stroke="#2b3038" stroke-width="3" stroke-linejoin="round">
    <polygon points="190,62 152,40 142,44 170,61"/>
    <polygon points="190,82 152,104 142,100 170,83"/>
  </g>

  <!-- 双垂尾 -->
  <g fill="url(#wing)" stroke="#2b3038" stroke-width="3" stroke-linejoin="round">
    <polygon points="56,64 36,44 46,46 64,63"/>
    <polygon points="56,80 36,100 46,98 64,81"/>
  </g>

  <!-- 机身（饱满，曲线轮廓，机头朝右） -->
  <path d="M234,72 C226,65 200,61 150,59 L70,59 C45,60 30,63 20,67 L14,72
           L20,77 C30,81 45,84 70,85 L150,85 C200,83 226,79 234,72 Z"
        fill="url(#body)" stroke="#2b3038" stroke-width="3" stroke-linejoin="round"/>

  <!-- 尾喷口 -->
  <g fill="#3a4150" stroke="#2b3038" stroke-width="1.5">
    <rect x="10" y="66" width="9" height="7" rx="2"/>
    <rect x="10" y="77" width="9" height="7" rx="2"/>
  </g>

  <!-- 进气道（暗色） -->
  <g fill="#39414f">
    <polygon points="150,63 122,61 120,67 150,67"/>
    <polygon points="150,81 122,83 120,77 150,77"/>
  </g>

  <!-- 翼下挂弹 -->
  <g>
    <rect x="98" y="37" width="34" height="6" rx="3" fill="url(#msl)" stroke="#2b3038" stroke-width="1.5"/>
    <polygon points="132,37 143,40 132,43" fill="#ff3b30" stroke="#2b3038" stroke-width="1"/>
    <rect x="98" y="101" width="34" height="6" rx="3" fill="url(#msl)" stroke="#2b3038" stroke-width="1.5"/>
    <polygon points="132,107 143,104 132,101" fill="#ff3b30" stroke="#2b3038" stroke-width="1"/>
  </g>

  <!-- 红色翼尖 -->
  <g fill="#ff3b30" stroke="#2b3038" stroke-width="2" stroke-linejoin="round">
    <polygon points="76,6 52,16 58,24 80,15"/>
    <polygon points="76,138 52,128 58,120 80,129"/>
  </g>

  <!-- 机头雷达罩 -->
  <polygon points="234,72 218,67 218,77" fill="#39414f" stroke="#2b3038" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 机身分线 -->
  <g stroke="#8a96a6" stroke-width="1.4" fill="none" opacity=".7">
    <path d="M210,72 L70,72"/>
    <path d="M120,64 L120,80"/>
    <path d="M160,63 L160,81"/>
  </g>

  <!-- 座舱盖 + 高光 -->
  <ellipse cx="198" cy="72" rx="16" ry="7" fill="url(#glass)" stroke="#2b3038" stroke-width="2"/>
  <ellipse cx="193" cy="69" rx="6" ry="2" fill="#ffffff" opacity=".8"/>
</svg>
